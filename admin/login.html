<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/admin/css/admin.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-mark">MC</div>
          <div>
            <div class="brand-name">Matis Coene</div>
            <div class="brand-subtitle">Backoffice</div>
          </div>
        </div>

        <h1>Welkom</h1>
        <p class="auth-subtitle">Log in om projecten en gebruikers te beheren.</p>

        <div id="loginAlert" class="alert alert-danger" hidden></div>

        <form id="loginForm" class="auth-form">
          <div class="auth-field">
            <label for="username">Username</label>
            <input id="username" class="form-control" type="text" autocomplete="username" required />
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <input id="password" class="form-control" type="password" autocomplete="current-password" required />
          </div>

          <button class="auth-button" type="submit"><i class="bi bi-box-arrow-in-right"></i> Login</button>
        </form>
      </div>
    </div>
    <script src="/admin/js/app.js"></script>
  </body>
</html>
